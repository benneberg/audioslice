<style>
:root {
  --bg: #F7F5F0;
  --surface: #FFFFFF;
  --black: #111111;
  --gray: #6B6B68;
  --line: #DCD9D1;
  --accent: #2563EB;
  --danger: #DC2626;
  --shadow: 0 20px 50px rgba(0,0,0,.10), 0 4px 15px rgba(0,0,0,.06);
  --soft-shadow: 0 8px 25px rgba(0,0,0,.08);
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  margin: 0;
  padding: 0;
  min-height: 100vh;
  min-height: 100dvh;
  background:
    radial-gradient(circle at 20% 0%, rgba(255,255,255,.9), transparent 35%),
    var(--bg);
  color: var(--black);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

.app {
  height: 100vh;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  padding: env(safe-area-inset-top) 22px env(safe-area-inset-bottom);
  position: relative;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-top: 20px;
  flex-shrink: 0;
}

.logo {
  font-size: 22px;
  font-weight: 700;
  letter-spacing: -.04em;
}

.icon-button {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  background: var(--black);
  color: white;
  border: none;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 20px;
  box-shadow: var(--soft-shadow);
  transition: .25s;
  cursor: pointer;
  -webkit-user-select: none;
  user-select: none;
}

.icon-button:active {
  transform: scale(.92);
}

.player {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 20px;
  min-height: 0;
}

.cover {
  width: min(60vw, 280px);
  aspect-ratio: 1;
  border-radius: 50%;
  background: linear-gradient(145deg, #ffffff, #dedbd2);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 80px;
  box-shadow:
    inset 0 0 40px rgba(255,255,255,.8),
    0 35px 70px rgba(0,0,0,.18);
  animation: float 6s ease-in-out infinite;
  flex-shrink: 0;
}

@keyframes float {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
}

.cover.playing {
  animation: rotateDisc 18s linear infinite;
}

@keyframes rotateDisc {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }

  display: inline-flex;
  align-items: center;

.song-name {

.song-actions {

  line-height: 1;

.delete-btn:active {

  font-size: 15px;

.toast {
  position: fixed;
  bottom: 110px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--black);
  color: white;
  padding: 12px 24px;
  border-radius: 50px;
  font-size: 14px;
  font-weight: 600;
  opacity: 0;
  transition: all 0.35s cubic-bezier(.2,.8,.2,1);
  z-index: 1000;
  pointer-events: none;
  white-space: nowrap;
  box-shadow: var(--soft-shadow);

.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);

.fade {

@keyframes appear {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: none; }
}

#songs::-webkit-scrollbar {
  width: 4px;
}

  border-radius: 4px;
}

@media (prefers-reduced-motion: reduce) {
  .cover { animation: none !important; }
  .fade { animation: none !important; }
}

<div class="app">

  <header class="header">
    <div class="logo">Nordic Player</div>
    <button class="icon-button" id="playlistToggle" aria-label="Playlist">☰</button>
  </header>

  <main class="player">

    <div class="cover" id="cover">🎧</div>

    <div class="song-title" id="title">Choose music</div>
    <div class="artist" id="artist">Local library</div>

    <button class="upload-button" id="addBtn" type="button">＋ Add songs</button>
    <input class="upload" id="filePicker" type="file" multiple>

    <div class="progress">
      <div class="waveform-wrap" id="waveformWrap">
        <canvas id="waveform"></canvas>
      </div>
      <div class="time">
        <span id="current">0:00</span>
        <span id="duration">0:00</span>
      </div>
    </div>

    <div class="controls">
      <button class="control" id="previous" aria-label="Previous">◀◀</button>
      <button class="control play" id="play" aria-label="Play">▶</button>
      <button class="control" id="next" aria-label="Next">▶▶</button>
    </div>

    <div class="secondary">
      <button class="control small" id="loop" aria-label="Loop">↻</button>
      <button class="control small" id="shuffle" aria-label="Shuffle">⤨</button>
    </div>

  </main>

  <div class="playlist" id="playlist">
    <div class="playlist-header">
      <div>
        <h2>Library</h2>
        <div class="playlist-meta" id="playlistMeta">0 songs</div>
      </div>
      <div class="playlist-actions">
        <button class="playlist-btn" id="clearLibrary">Clear</button>
      </div>
    </div>
    <div id="songs"></div>
  </div>

</div>

<audio id="audio" preload="metadata"></audio>

<script>
const DB_NAME = 'NordicPlayerDB';
const DB_VERSION = 1;
const STORE_NAME = 'songs';

const audio = document.getElementById('audio');
const addBtn = document.getElementById('addBtn');
const picker = document.getElementById('filePicker');
const title = document.getElementById('title');
const artist = document.getElementById('artist');
const cover = document.getElementById('cover');
const playBtn = document.getElementById('play');
const nextBtn = document.getElementById('next');
const previousBtn = document.getElementById('previous');
const currentTimeEl = document.getElementById('current');
const durationTimeEl = document.getElementById('duration');
const playlistPanel = document.getElementById('playlist');
const playlistToggle = document.getElementById('playlistToggle');
const songsContainer = document.getElementById('songs');
const loopBtn = document.getElementById('loop');
const shuffleBtn = document.getElementById('shuffle');
const waveformCanvas = document.getElementById('waveform');
const waveformWrap = document.getElementById('waveformWrap');
const playlistMeta = document.getElementById('playlistMeta');
const clearLibraryBtn = document.getElementById('clearLibrary');

let playlist = [];
let currentIndex = 0;
let loop = false;
let shuffle = false;
let isPlaying = false;
let currentPeaks = null;
let isScrubbing = false;
let peaksCache = {};

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onerror = () => reject(req.error);
    req.onsuccess = () => resolve(req.result);
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains(STORE_NAME)) {
        const store = db.createObjectStore(STORE_NAME, { keyPath: 'id', autoIncrement: true });
        store.createIndex('title', 'title', { unique: false });
      }
    };
  });
}

function readFileAsArrayBuffer(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.onerror = reject;
    r.readAsArrayBuffer(file);
  });
}

async function saveSong(file) {
  const db = await openDB();
  const data = await readFileAsArrayBuffer(file);
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, 'readwrite');
    const store = tx.objectStore(STORE_NAME);
    const song = {
      title: cleanName(file.name),
      type: file.type,
      size: file.size,
      data: data,
      added: Date.now()
    };
    const req = store.add(song);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function getAllSongs() {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, 'readonly');
    const store = tx.objectStore(STORE_NAME);
    const req = store.getAll();
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function getSong(id) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, 'readonly');
    const store = tx.objectStore(STORE_NAME);
    const req = store.get(id);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function deleteSong(id) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, 'readwrite');
    const store = tx.objectStore(STORE_NAME);
    const req = store.delete(id);
    req.onsuccess = () => resolve();
    req.onerror = () => reject(req.error);
  });
}

async function clearAllSongs() {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, 'readwrite');
    const store = tx.objectStore(STORE_NAME);
    const req = store.clear();
    req.onsuccess = () => resolve();
    req.onerror = () => reject(req.error);
  });
}

function resizeCanvas() {
  const dpr = window.devicePixelRatio || 1;
  const rect = waveformWrap.getBoundingClientRect();
  waveformCanvas.width = rect.width * dpr;
  waveformCanvas.height = rect.height * dpr;
  const ctx = waveformCanvas.getContext('2d');
  ctx.scale(dpr, dpr);
  if (currentPeaks && audio.duration) {
    drawWaveform(currentPeaks, audio.currentTime / audio.duration);
  }
}

function drawWaveform(peaks, progress) {
  const canvas = waveformCanvas;
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const width = canvas.width / dpr;
  const height = canvas.height / dpr;

  ctx.clearRect(0, 0, width, height);

  if (!peaks || !peaks.length) {
    ctx.fillStyle = '#DCD9D1';
    ctx.fillRect(0, height/2 - 1, width, 2);
    return;
  }

  const barWidth = 2;
  const gap = 1.5;
  const totalBars = Math.floor(width / (barWidth + gap));
  const progressX = width * progress;

  for (let i = 0; i < totalBars; i++) {
    const idx = Math.floor((i / totalBars) * peaks.length);
    const amp = peaks[idx] || 0;
    const barHeight = Math.max(3, amp * height * 0.82);
    const x = i * (barWidth + gap);
    const y = (height - barHeight) / 2;

    ctx.fillStyle = x < progressX ? '#111111' : '#DCD9D1';
    ctx.beginPath();
    ctx.roundRect(x, y, barWidth, barHeight, 1);
    ctx.fill();
  }

  if (progress > 0) {
    ctx.fillStyle = '#2563EB';
    ctx.fillRect(progressX - 1, 0, 2, height);
  }
}

async function computePeaks(arrayBuffer) {
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  try {
    const buffer = await ctx.decodeAudioData(arrayBuffer.slice(0));
    const data = buffer.getChannelData(0);
    const count = 1200;
    const step = Math.floor(data.length / count);
    const peaks = [];
    for (let i = 0; i < count; i++) {
      let max = 0;
      const start = i * step;
      const end = Math.min(start + step, data.length);
      for (let j = start; j < end; j++) {
        const v = Math.abs(data[j]);
        if (v > max) max = v;
      }
      peaks.push(max);
    }
    return peaks;
  } catch (e) {
    console.error('Waveform decode failed:', e);
    return null;
  } finally {
    await ctx.close();
  }
}

function getProgressFromX(clientX) {
  const rect = waveformWrap.getBoundingClientRect();
  const x = Math.max(0, Math.min(clientX - rect.left, rect.width));
  return x / rect.width;
}

function seekToProgress(p) {
  if (audio.duration) {
    audio.currentTime = p * audio.duration;
    if (currentPeaks) drawWaveform(currentPeaks, p);
  }
}

waveformWrap.addEventListener('pointerdown', (e) => {
  isScrubbing = true;
  waveformWrap.setPointerCapture(e.pointerId);
  seekToProgress(getProgressFromX(e.clientX));
});

waveformWrap.addEventListener('pointermove', (e) => {
  if (!isScrubbing) return;
  seekToProgress(getProgressFromX(e.clientX));
});

waveformWrap.addEventListener('pointerup', () => {
  isScrubbing = false;
});

function cleanName(name) {
  return name.replace(/\.[^/.]+$/, '').replace(/[_-]/g, ' ').trim();
}

async function loadSong(index) {
  if (!playlist[index]) return;
  currentIndex = index;
  const song = playlist[index];

  audio.src = song.url;
  title.textContent = song.title;
  artist.textContent = 'Local audio';

  currentPeaks = peaksCache[song.id] || null;
  if (!currentPeaks) {
    try {
      const record = await getSong(song.id);
      if (record && record.data) {
        const peaks = await computePeaks(record.data);
        if (peaks) {
          currentPeaks = peaks;
          peaksCache[song.id] = peaks;
        }
      }
    } catch (e) {
      console.error(e);
    }
  }
  resizeCanvas();
  drawWaveform(currentPeaks, 0);

  play();
  updatePlaylist();
  updateMediaSession();
}

function play() {
  audio.play().then(() => {
    isPlaying = true;
    playBtn.textContent = 'Ⅱ';
    cover.classList.add('playing');
  }).catch(() => {});
}

function pause() {
  audio.pause();
  isPlaying = false;
  playBtn.textContent = '▶';
  cover.classList.remove('playing');
}

function togglePlay() {
  if (!audio.src) return;
  isPlaying ? pause() : play();
}

function playNext() {
  if (!playlist.length) return;
  if (shuffle) {
    currentIndex = Math.floor(Math.random() * playlist.length);
  } else {
    currentIndex++;
    if (currentIndex >= playlist.length) currentIndex = 0;
  }
  loadSong(currentIndex);
}

function playPrevious() {
  if (!playlist.length) return;
  if (audio.currentTime > 5) {
    audio.currentTime = 0;
    return;
  }
  currentIndex--;
  if (currentIndex < 0) currentIndex = playlist.length - 1;
  loadSong(currentIndex);
}

playBtn.onclick = togglePlay;
nextBtn.onclick = playNext;
previousBtn.onclick = playPrevious;

audio.addEventListener('timeupdate', () => {
  if (!audio.duration) return;
  currentTimeEl.textContent = formatTime(audio.currentTime);
  durationTimeEl.textContent = formatTime(audio.duration);
});

audio.addEventListener('ended', () => {
  if (loop) {
    audio.currentTime = 0;
    play();
  } else {
    playNext();
  }
});

loopBtn.onclick = () => {
  loop = !loop;
  loopBtn.classList.toggle('active', loop);
};

shuffleBtn.onclick = () => {
  shuffle = !shuffle;
  shuffleBtn.classList.toggle('active', shuffle);
};

playlistToggle.onclick = () => {
  playlistPanel.classList.toggle('open');
};

function formatTime(s) {
  if (isNaN(s)) return '0:00';
  const m = Math.floor(s / 60);
  const sec = Math.floor(s % 60).toString().padStart(2, '0');
  return `${m}:${sec}`;
}

function escapeHtml(t) {
  const d = document.createElement('div');
  d.textContent = t;
  return d.innerHTML;
}

function renderPlaylist() {
  songsContainer.innerHTML = '';
  playlistMeta.textContent = `${playlist.length} song${playlist.length !== 1 ? 's' : ''}`;

  if (!playlist.length) {
    songsContainer.innerHTML = '<div class="empty-state">No songs yet.<br>Add your music to get started.</div>';
    return;
  }

  playlist.forEach((song, index) => {
    const item = document.createElement('div');
    item.className = 'song-item';
    if (index === currentIndex) item.classList.add('active');

    const info = document.createElement('div');
    info.className = 'song-info';
    info.innerHTML = `<div class="song-name">${escapeHtml(song.title)}</div>`;

    const actions = document.createElement('div');
    actions.className = 'song-actions';

    const del = document.createElement('button');
    del.className = 'delete-btn';
    del.innerHTML = '×';
    del.setAttribute('aria-label', 'Delete');
    del.onclick = (e) => {
      e.stopPropagation();
      removeSong(index);
    };

    actions.appendChild(del);
    item.appendChild(info);
    item.appendChild(actions);

    item.onclick = () => {
      loadSong(index);
      playlistPanel.classList.remove('open');
    };

    songsContainer.appendChild(item);
  });
}

function updatePlaylist() {
  document.querySelectorAll('.song-item').forEach((el, i) => {
    el.classList.toggle('active', i === currentIndex);
  });
}

async function removeSong(index) {
  const song = playlist[index];
  if (!song) return;

  const wasCurrent = currentIndex === index;
  const wasPlaying = isPlaying && wasCurrent;

  URL.revokeObjectURL(song.url);
  await deleteSong(song.id);
  delete peaksCache[song.id];
  playlist.splice(index, 1);

  if (playlist.length === 0) {
    audio.pause();
    audio.src = '';
    isPlaying = false;
    playBtn.textContent = '▶';
    cover.classList.remove('playing');
    title.textContent = 'Choose music';
    artist.textContent = 'Local library';
    currentPeaks = null;
    drawWaveform(null, 0);
    currentIndex = 0;
  } else if (wasCurrent) {
    if (currentIndex >= playlist.length) currentIndex = 0;
    await loadSong(currentIndex);
    if (!wasPlaying) pause();
  } else if (index < currentIndex) {
    currentIndex--;
  }

  renderPlaylist();
  showToast('Song removed');
}

async function clearLibrary() {
  if (!playlist.length) return;
  if (!confirm('Remove all songs from your library? This cannot be undone.')) return;

  playlist.forEach(s => URL.revokeObjectURL(s.url));
  await clearAllSongs();
  playlist = [];
  currentIndex = 0;
  audio.pause();
  audio.src = '';
  isPlaying = false;
  playBtn.textContent = '▶';
  cover.classList.remove('playing');
  title.textContent = 'Choose music';
  artist.textContent = 'Local library';
  currentPeaks = null;
  drawWaveform(null, 0);
  peaksCache = {};
  renderPlaylist();
  showToast('Library cleared');
}

clearLibraryBtn.onclick = clearLibrary;

addBtn.addEventListener('click', () => {
  picker.click();
});

picker.addEventListener('click', () => {
  picker.value = '';
});

picker.addEventListener('change', async (e) => {
  const files = Array.from(e.target.files);
  if (!files.length) return;

  let added = 0;
  for (const file of files) {
    try {
      const id = await saveSong(file);
      playlist.push({
        id,
        title: cleanName(file.name),
        url: URL.createObjectURL(file)
      });
      added++;
    } catch (err) {
      console.error('Failed to save song:', err);
    }
  }

  picker.value = '';

  renderPlaylist();
  showToast(`${added} song${added !== 1 ? 's' : ''} added`);

  if (added && !audio.src && playlist.length === added) {
    loadSong(0);
  }
});

function updateMediaSession() {
  if (!('mediaSession' in navigator)) return;
  const song = playlist[currentIndex];
  if (!song) return;
  navigator.mediaSession.metadata = new MediaMetadata({
    title: song.title,
    artist: 'Nordic Player',
    album: 'Local Library'
  });
}

if ('mediaSession' in navigator) {
  navigator.mediaSession.setActionHandler('play', play);
  navigator.mediaSession.setActionHandler('pause', pause);
  navigator.mediaSession.setActionHandler('nexttrack', playNext);
  navigator.mediaSession.setActionHandler('previoustrack', playPrevious);
}

let touchStartX = 0;
let touchStartY = 0;

document.addEventListener('touchstart', e => {
  touchStartX = e.changedTouches[0].screenX;
  touchStartY = e.changedTouches[0].screenY;
}, { passive: true });

document.addEventListener('touchend', e => {
  const x = e.changedTouches[0].screenX;
  const y = e.changedTouches[0].screenY;
  const dx = x - touchStartX;
  const dy = y - touchStartY;

  if (Math.abs(dx) > 80) {
    if (dx < 0) playNext();
    else playPrevious();
  }
  if (dy < -100) {
    playlistPanel.classList.add('open');
  }
}, { passive: true });

document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT') return;
  switch (e.code) {
    case 'Space':
      e.preventDefault();
      togglePlay();
      break;
    case 'ArrowRight':
      playNext();
      break;
    case 'ArrowLeft':
      playPrevious();
      break;
  }
});

function showToast(msg) {
  const existing = document.querySelector('.toast');
  if (existing) existing.remove();
  const toast = document.createElement('div');
  toast.className = 'toast';
  toast.textContent = msg;
  document.body.appendChild(toast);
  requestAnimationFrame(() => toast.classList.add('show'));
  setTimeout(() => {
    toast.classList.remove('show');
    setTimeout(() => toast.remove(), 350);
  }, 2000);
}

function animate() {
  if (audio.duration && currentPeaks && !isScrubbing) {
    const progress = audio.currentTime / audio.duration;
    drawWaveform(currentPeaks, progress);
  }
  requestAnimationFrame(animate);
}
requestAnimationFrame(animate);

function registerServiceWorker() {
  if (!('serviceWorker' in navigator)) return;
  const swCode = `
    const CACHE_NAME = 'nordic-player-v1';
    const APP_URL = '${location.href}';
    self.addEventListener('install', e => {
      e.waitUntil(
        caches.open(CACHE_NAME)
          .then(cache => cache.add(new Request(APP_URL)))
          .then(() => self.skipWaiting())
      );
    });
    self.addEventListener('activate', e => {
      e.waitUntil(self.clients.claim());
    });
    self.addEventListener('fetch', e => {
      e.respondWith(
        caches.match(e.request).then(r => r || fetch(e.request)).catch(() => caches.match(new Request(APP_URL)))
      );
    });
  `;
  const blob = new Blob([swCode], { type: 'application/javascript' });
  const url = URL.createObjectURL(blob);
  navigator.serviceWorker.register(url).catch(() => {});
}

async function init() {
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);

  try {
    const songs = await getAllSongs();
    if (songs.length) {
      playlist = songs.map(song => ({
        id: song.id,
        title: song.title,
        url: URL.createObjectURL(new Blob([song.data], { type: song.type }))
      }));
      renderPlaylist();
      loadSong(0);
    } else {
      renderPlaylist();
    }
  } catch (e) {
    console.error('Library load failed:', e);
    renderPlaylist();
  }

  registerServiceWorker();
}

init();
</script>
