<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nordic Wave">
<meta name="theme-color" content="#F7F5F0">
<meta name="description" content="A premium music player with waveform visualization">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect fill='%23F7F5F0' width='180' height='180' rx='40'/><circle cx='90' cy='90' r='60' fill='%231E293B'/><circle cx='90' cy='90' r='20' fill='%23F7F5F0'/></svg>">
<title>Nordic Wave</title>
<style>
:root {
    --bg: #F7F5F0;
    --surface: #FFFFFF;
    --black: #111111;
    --gray: #6B6B68;
    --line: #DCD9D1;
    --accent: #2563EB;
    --accent-secondary: #7C3AED;
    --waveform: #1E293B;
    --waveform-progress: #2563EB;
    --shadow: 0 20px 50px rgba(0,0,0,.10), 0 4px 15px rgba(0,0,0,.06);
    --soft-shadow: 0 8px 25px rgba(0,0,0,.08);
    --glass: rgba(255,255,255,0.6);
    --record-groove: rgba(255,255,255,0.06);
    --tonearm: #c8c8d0;
}

[data-theme="dark"] {
    --bg: #050508;
    --surface: rgba(255,255,255,0.03);
    --black: #f0f0f5;
    --gray: #8888a0;
    --line: rgba(255,255,255,0.08);
    --accent: #8B5CF6;
    --accent-secondary: #EC4899;
    --waveform: #4b5563;
    --waveform-progress: #8B5CF6;
    --shadow: 0 20px 50px rgba(0,0,0,.5), 0 4px 15px rgba(0,0,0,.4);
    --soft-shadow: 0 8px 25px rgba(0,0,0,.3);
    --glass: rgba(255,255,255,0.05);
    --record-groove: rgba(255,255,255,0.04);
    --tonearm: #d8d8e0;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body {
    background: var(--bg);
    color: var(--black);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    transition: background 0.5s ease, color 0.5s ease;
}

.app {
    height: 100vh; height: 100dvh;
    display: flex; flex-direction: column;
    padding: env(safe-area-inset-top) 22px env(safe-area-inset-bottom);
    max-width: 500px; margin: 0 auto;
    position: relative;
}

[data-theme="dark"] .app::before {
    content: '';
    position: fixed; top: -20%; left: -20%; width: 140%; height: 140%;
    background:
        radial-gradient(ellipse at 20% 30%, rgba(139,92,246,0.08) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 70%, rgba(236,72,153,0.06) 0%, transparent 50%);
    pointer-events: none; z-index: 0;
}

.header {
    display: flex; justify-content: space-between; align-items: center;
    padding-top: 12px; padding-bottom: 6px;
    position: relative; z-index: 1; flex-shrink: 0;
}
.logo { font-size: 20px; font-weight: 700; letter-spacing: -0.04em; }
.logo-icon { display: flex; align-items: center; gap: 10px; }
.logo-icon svg { width: 28px; height: 28px; }
.header-actions { display: flex; gap: 10px; align-items: center; }

.icon-button {
    width: 44px; height: 44px; border-radius: 50%;
    background: var(--black); color: var(--bg); border: none;
    display: flex; justify-content: center; align-items: center;
    box-shadow: var(--soft-shadow);
    transition: transform 0.15s ease, opacity 0.15s ease;
    cursor: pointer;
}
.icon-button:active { transform: scale(0.92); }
.icon-button svg { width: 20px; height: 20px; fill: currentColor; }
.theme-toggle {
    background: var(--glass); color: var(--black); border: 1px solid var(--line);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
}

.player {
    flex: 1;
    display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    gap: clamp(6px, 1.5vh, 14px);
    padding: clamp(4px, 1vh, 10px) 0;
    min-height: 0;
    position: relative; z-index: 1;
}

/* ====== VINYL RECORD ====== */
.cover-container {
    position: relative;
    width: min(52vw, 220px);
    aspect-ratio: 1;
    flex-shrink: 0;
}

.cover {
    width: 100%; height: 100%;
    border-radius: 50%;
    background:
        radial-gradient(circle at 30% 30%, rgba(255,255,255,0.08) 0%, transparent 40%),
        radial-gradient(circle at 70% 70%, rgba(0,0,0,0.6) 0%, transparent 50%),
        repeating-radial-gradient(
            circle at center,
            #0a0a0a 0px,
            #0a0a0a 2px,
            #111111 2.5px,
            #111111 3.5px
        );
    display: flex; align-items: center; justify-content: center;
    box-shadow:
        0 0 0 2px rgba(0,0,0,0.3),
        0 0 0 4px rgba(0,0,0,0.1),
        0 25px 60px rgba(0,0,0,0.35),
        inset 0 0 30px rgba(0,0,0,0.8);
    overflow: hidden;
    position: relative;
    transition: box-shadow 0.5s ease;
}

[data-theme="light"] .cover {
    box-shadow:
        0 0 0 2px rgba(0,0,0,0.15),
        0 0 0 4px rgba(0,0,0,0.05),
        0 25px 60px rgba(0,0,0,0.18),
        inset 0 0 30px rgba(0,0,0,0.6);
}

.cover.playing {
    animation: rotateDisc 1.8s linear infinite;
}

@keyframes rotateDisc {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
}

/* Vinyl grooves overlay (subtle extra rings) */
.vinyl-grooves {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%;
    border-radius: 50%;
    pointer-events: none;
    opacity: 0.25;
    animation: none !important;
}
.vinyl-grooves circle {
    fill: none;
    stroke: var(--record-groove);
    stroke-width: 0.4;
}

/* Center label / sticker */
.cover-label {
    position: absolute;
    width: 32%;
    height: 32%;
    border-radius: 50%;
    background: linear-gradient(135deg, #e8e8e8 0%, #f5f5f5 50%, #d0d0d0 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow:
        0 1px 4px rgba(0,0,0,0.3),
        inset 0 1px 2px rgba(255,255,255,0.8);
    overflow: hidden;
}

.cover-label::before {
    content: '';
    position: absolute;
    inset: 8%;
    border-radius: 50%;
    border: 1.5px dashed rgba(0,0,0,0.15);
}

.cover-label::after {
    content: '';
    width: 18%;
    height: 18%;
    border-radius: 50%;
    background: #1a1a1a;
    box-shadow: inset 0 1px 3px rgba(0,0,0,0.5);
}

/* Label text so you can see it spin */
.label-text {
    position: absolute;
    width: 100%; height: 100%;
    border-radius: 50%;
    animation: none;
}
.cover.playing .label-text {
    animation: rotateDisc 1.8s linear infinite;
}

.label-text svg {
    width: 70%; height: 70%;
    opacity: 0.25;
    position: absolute;
    top: 15%; left: 15%;
}

/* Light reflection sheen on vinyl */
.cover::after {
    content: '';
    position: absolute;
    top: -50%; left: -50%;
    width: 200%; height: 200%;
    background: conic-gradient(from 180deg at 50% 50%, transparent 0deg, rgba(255,255,255,0.03) 30deg, transparent 60deg);
    pointer-events: none;
    border-radius: 50%;
}

/* ====== PROGRESS RING ====== */
.progress-ring {
    position: absolute;
    top: -6px; left: -6px;
    width: calc(100% + 12px);
    height: calc(100% + 12px);
    pointer-events: none;
    transform: rotate(-90deg);
}
.progress-ring-bg {
    fill: none;
    stroke: var(--line);
    stroke-width: 2.5;
    opacity: 0.25;
}
.progress-ring-fill {
    fill: none;
    stroke: url(#ringGradient);
    stroke-width: 3;
    stroke-linecap: round;
    transition: stroke-dashoffset 0.1s linear;
}

/* ====== TONEARM ====== */
.tonearm-container {
    position: absolute;
    top: -18px;
    right: -18px;
    width: 90px;
    height: 130px;
    pointer-events: none;
    z-index: 10;
    transform-origin: 72px 18px;
    transform: rotate(-48deg);
    transition: transform 0.9s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.tonearm-container.playing {
    transform: rotate(-8deg);
}

/* Pivot base */
.tonearm-pivot {
    position: absolute;
    top: 8px;
    right: 8px;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: linear-gradient(145deg, #e8e8e8, #999);
    box-shadow: 0 2px 6px rgba(0,0,0,0.4), inset 0 1px 1px rgba(255,255,255,0.5);
    z-index: 2;
}

/* The arm — one continuous shape using border */
.tonearm-arm {
    position: absolute;
    top: 16px;
    right: 16px;
    width: 5px;
    height: 88px;
    background: linear-gradient(to bottom, var(--tonearm), #9090a0);
    border-radius: 3px;
    transform-origin: top center;
    transform: rotate(18deg);
    box-shadow: 1px 1px 3px rgba(0,0,0,0.3);
}

/* Counterweight at back */
.tonearm-counterweight {
    position: absolute;
    top: 12px;
    right: 12px;
    width: 14px;
    height: 22px;
    background: linear-gradient(to bottom, #bbb, #888);
    border-radius: 3px;
    transform: rotate(18deg);
    box-shadow: 1px 1px 3px rgba(0,0,0,0.3);
}

/* Headshell (cartridge holder) */
.tonearm-headshell {
    position: absolute;
    bottom: 10px;
    left: 18px;
    width: 16px;
    height: 24px;
    background: linear-gradient(145deg, #2a2a2a, #0a0a0a);
    border-radius: 4px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.5);
    transform: rotate(-8deg);
}

/* Needle / stylus */
.tonearm-headshell::after {
    content: '';
    position: absolute;
    bottom: -3px;
    left: 50%;
    transform: translateX(-50%);
    width: 2px;
    height: 5px;
    background: #ff3333;
    border-radius: 1px;
    box-shadow: 0 0 2px rgba(255,51,51,0.6);
}

/* Connector between arm and headshell */
.tonearm-connector {
    position: absolute;
    bottom: 32px;
    left: 28px;
    width: 4px;
    height: 14px;
    background: linear-gradient(to bottom, var(--tonearm), #707080);
    border-radius: 2px;
    transform: rotate(55deg);
}

/* ====== SONG INFO ====== */
.song-info {
    text-align: center;
    width: 100%; max-width: 90%;
    flex-shrink: 0;
}
.song-title {
    font-size: clamp(18px, 5vw, 22px);
    font-weight: 700;
    letter-spacing: -0.03em;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    margin-bottom: 3px;
}
.artist { font-size: 14px; color: var(--gray); }

/* ====== UPLOAD ====== */
.upload-section {
    padding: 4px 0;
    position: relative;
    flex-shrink: 0;
}
.upload-button {
    display: inline-flex; align-items: center; gap: 8px;
    border: 1.5px solid var(--black);
    padding: 10px 20px;
    border-radius: 50px;
    font-weight: 600; font-size: 13px;
    background: transparent; color: var(--black);
    cursor: pointer; transition: all 0.2s ease;
    position: relative; z-index: 1;
}
.upload-button:hover { background: var(--black); color: var(--bg); }
.upload-button:active { transform: scale(0.96); }
.upload-button svg { width: 16px; height: 16px; }
.upload-input {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%;
    opacity: 0; cursor: pointer; z-index: 2;
    -webkit-appearance: none; appearance: none;
}

/* ====== WAVEFORM ====== */
.waveform-container {
    width: 100%;
    padding: 8px 0;
    position: relative;
    flex-shrink: 0;
}
.waveform-info {
    display: flex; justify-content: space-between;
    font-size: 11px; color: var(--gray);
    margin-bottom: 6px;
    font-variant-numeric: tabular-nums;
}
.waveform-canvas {
    width: 100%;
    height: clamp(36px, 9vh, 64px);
    cursor: pointer;
    border-radius: 8px;
    background: rgba(128,128,128,0.04);
}
.waveform-canvas:active { background: rgba(128,128,128,0.08); }

.progress-bar {
    width: 100%; height: 4px;
    background: var(--line);
    border-radius: 2px;
    overflow: hidden;
    cursor: pointer;
    margin-top: 6px;
}
.progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent-secondary));
    width: 0%;
    transition: width 0.1s linear;
}

/* ====== CONTROLS ====== */
.controls {
    display: flex; align-items: center; justify-content: center;
    gap: clamp(12px, 4vw, 20px);
    padding: 6px 0;
    flex-shrink: 0;
}
.control {
    width: 52px; height: 52px;
    border-radius: 50%; border: none;
    background: var(--surface);
    color: var(--black);
    font-size: 20px;
    box-shadow: var(--soft-shadow);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: transform 0.15s ease, background 0.2s ease;
    position: relative;
}
.control:active { transform: scale(0.9); }
.control svg { width: 22px; height: 22px; fill: currentColor; }

.control.play {
    width: 68px; height: 68px;
    background: var(--black); color: var(--bg);
    font-size: 26px; z-index: 1;
}
.control.play svg { width: 26px; height: 26px; position: relative; z-index: 2; }

.control.play .blob {
    position: absolute; inset: -5px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent-secondary));
    z-index: -1; opacity: 0;
    filter: blur(0px);
    transition: opacity 0.4s ease;
}
.control.play.playing .blob {
    opacity: 1;
    animation: blob-morph 4s ease-in-out infinite, blob-spin 8s linear infinite;
}
.control.play.playing .blob::after {
    content: '';
    position: absolute; inset: -4px;
    border-radius: 50%;
    background: linear-gradient(225deg, var(--accent-secondary), var(--accent));
    animation: blob-morph 5s ease-in-out infinite reverse, blob-spin 10s linear infinite reverse;
    opacity: 0.6;
    filter: blur(6px);
}
@keyframes blob-morph {
    0%, 100% { border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%; }
    25% { border-radius: 30% 60% 70% 40% / 50% 60% 30% 60%; }
    50% { border-radius: 50% 50% 40% 60% / 40% 50% 60% 50%; }
    75% { border-radius: 40% 60% 50% 50% / 60% 40% 50% 50%; }
}
@keyframes blob-spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
}

.control.small { width: 40px; height: 40px; font-size: 14px; }
.control.small svg { width: 16px; height: 16px; }
.control.active { background: var(--accent); color: white; }

/* ====== PLAYLIST ====== */
.playlist-panel {
    position: fixed; left: 0; right: 0; bottom: 0;
    max-height: 60vh;
    background: var(--surface);
    border-radius: 30px 30px 0 0;
    padding: 25px;
    padding-bottom: calc(env(safe-area-inset-bottom) + 25px);
    box-shadow: var(--shadow);
    transform: translateY(100%);
    transition: transform 0.45s cubic-bezier(0.2, 0.8, 0.2, 1);
    z-index: 100;
    overflow: hidden;
    display: flex; flex-direction: column;
    backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
    border-top: 1px solid var(--line);
}
[data-theme="dark"] .playlist-panel { background: rgba(15,15,22,0.95); }
.playlist-panel.open { transform: translateY(0); }
.playlist-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 16px;
}
.playlist-header h2 { font-size: 18px; font-weight: 700; letter-spacing: -0.02em; }
.playlist-actions { display: flex; gap: 10px; }
.playlist-action {
    padding: 8px 16px; border-radius: 20px; border: none;
    background: var(--bg); color: var(--gray);
    font-size: 13px; cursor: pointer; transition: all 0.2s ease;
}
.playlist-action:hover { background: var(--line); }
.playlist-action.danger:hover { background: rgba(220,38,38,0.15); color: #EF4444; }
.playlist-songs { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.playlist-empty { text-align: center; padding: 30px 20px; color: var(--gray); }
.playlist-empty svg { width: 44px; height: 44px; opacity: 0.3; margin-bottom: 10px; }
.song-item {
    display: flex; align-items: center; gap: 12px;
    padding: 12px; border-radius: 14px;
    cursor: pointer; transition: background 0.15s ease;
    margin-bottom: 4px;
}
.song-item:hover { background: rgba(128,128,128,0.06); }
.song-item.active { background: linear-gradient(135deg, rgba(139,92,246,0.12), rgba(236,72,153,0.08)); }
.song-item.active .song-item-title { color: var(--accent); }
.song-icon {
    width: 36px; height: 36px; border-radius: 10px;
    background: linear-gradient(135deg, var(--line), transparent);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
}
.song-icon svg { width: 18px; height: 18px; opacity: 0.5; fill: currentColor; }
.song-item-info { flex: 1; min-width: 0; }
.song-item-title { font-size: 14px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.song-item-duration { font-size: 11px; color: var(--gray); margin-top: 2px; }
.song-item-delete {
    width: 30px; height: 30px; border-radius: 50%; border: none;
    background: transparent; color: var(--gray);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; opacity: 0;
    transition: opacity 0.15s ease, background 0.15s ease;
}
.song-item:hover .song-item-delete { opacity: 1; }
.song-item-delete:hover { background: rgba(220,38,38,0.15); color: #EF4444; }
.song-item-delete svg { width: 14px; height: 14px; }

/* ====== OVERLAY / TOAST / MISC ====== */
.overlay {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.5);
    opacity: 0; pointer-events: none;
    transition: opacity 0.3s ease;
    z-index: 99;
}
.overlay.visible { opacity: 1; pointer-events: auto; }
.toast {
    position: fixed; bottom: 90px; left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: var(--black); color: var(--bg);
    padding: 12px 22px; border-radius: 50px;
    font-size: 13px; font-weight: 500;
    opacity: 0; transition: all 0.3s ease;
    z-index: 200; pointer-events: none;
    box-shadow: var(--soft-shadow);
}
.toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

.install-banner {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--black); color: var(--bg);
    padding: 14px 22px;
    padding-bottom: calc(env(safe-area-inset-bottom) + 14px);
    display: flex; align-items: center; justify-content: space-between;
    transform: translateY(100%); transition: transform 0.4s ease;
    z-index: 150; gap: 12px;
}
.install-banner.show { transform: translateY(0); }
.install-banner-text { font-size: 13px; font-weight: 500; flex: 1; }
.install-banner-btn {
    padding: 8px 18px; background: var(--accent); color: white;
    border: none; border-radius: 50px;
    font-weight: 600; font-size: 13px; cursor: pointer; white-space: nowrap;
}
.install-banner-close {
    width: 28px; height: 28px; border: none;
    background: rgba(255,255,255,0.15); color: var(--bg);
    border-radius: 50%; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
}
.playlist-songs::-webkit-scrollbar { width: 4px; }
.playlist-songs::-webkit-scrollbar-track { background: transparent; }
.playlist-songs::-webkit-scrollbar-thumb { background: var(--line); border-radius: 2px; }

/* Compact screens */
@media (max-height: 700px) {
    .cover-container { width: min(46vw, 180px); }
    .player { gap: 5px; padding: 2px 0; }
    .waveform-canvas { height: 36px; }
    .control.play { width: 58px; height: 58px; }
    .control { width: 44px; height: 44px; }
    .tonearm-container { transform: rotate(-44deg) scale(0.85); right: -14px; top: -14px; }
    .tonearm-container.playing { transform: rotate(-10deg) scale(0.85); }
}
@media (max-height: 600px) {
    .cover-container { width: min(40vw, 160px); }
    .header { padding-top: 6px; }
    .tonearm-container { transform: rotate(-40deg) scale(0.75); right: -12px; top: -12px; }
    .tonearm-container.playing { transform: rotate(-12deg) scale(0.75); }
}
</style>
</head>
<body>
<div class="app">
    <header class="header">
        <div class="logo-icon">
            <svg viewBox="0 0 32 32" fill="none">
                <circle cx="16" cy="16" r="14" stroke="currentColor" stroke-width="2"/>
                <circle cx="16" cy="16" r="5" fill="currentColor"/>
                <circle cx="16" cy="16" r="10" stroke="currentColor" stroke-width="1" opacity="0.3"/>
            </svg>
            <div class="logo">Nordic Wave</div>
        </div>
        <div class="header-actions">
            <button class="icon-button theme-toggle" id="themeToggle" aria-label="Toggle theme">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" id="themeIcon">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                </svg>
            </button>
            <button class="icon-button" id="playlistToggle" aria-label="Toggle playlist">
                <svg viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
            </button>
        </div>
    </header>

<audio id="audio" preload="metadata"></audio>

<script>
const DB_NAME = 'NordicWaveDB';
const DB_VERSION = 1;
const STORE_NAME = 'songs';
let db = null;
let audioContext = null;
let playlist = [];
let currentIndex = -1;
let isPlaying = false;
let loop = false;
let shuffle = false;
let waveformData = [];
let audioBuffer = null;
const RING_CIRCUMFERENCE = 2 * Math.PI * 46;

const audio = document.getElementById('audio');
const filePicker = document.getElementById('filePicker');
const cover = document.getElementById('cover');
const coverLabel = document.getElementById('coverLabel');
const songTitle = document.getElementById('songTitle');
const artistName = document.getElementById('artistName');
const currentTimeEl = document.getElementById('currentTime');
const totalTimeEl = document.getElementById('totalTime');
const waveformCanvas = document.getElementById('waveformCanvas');
const progressFill = document.getElementById('progressFill');
const playBtn = document.getElementById('playBtn');
const playIcon = document.getElementById('playIcon');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const shuffleBtn = document.getElementById('shuffleBtn');
const loopBtn = document.getElementById('loopBtn');
const playlistToggle = document.getElementById('playlistToggle');
const playlistPanel = document.getElementById('playlistPanel');
const playlistSongs = document.getElementById('playlistSongs');
const overlay = document.getElementById('overlay');
const toast = document.getElementById('toast');
const emptyState = document.getElementById('emptyState');
const addMoreBtn = document.getElementById('addMoreBtn');
const clearAllBtn = document.getElementById('clearAllBtn');
const installBanner = document.getElementById('installBanner');
const installBtn = document.getElementById('installBtn');
const installClose = document.getElementById('installClose');
const vinylGrooves = document.getElementById('vinylGrooves');
const tonearm = document.getElementById('tonearm');
const progressRing = document.getElementById('progressRing');
const themeToggle = document.getElementById('themeToggle');
const themeIcon = document.getElementById('themeIcon');

function initTheme() {
    const saved = localStorage.getItem('nordic-theme');
    if (saved) {
        document.documentElement.setAttribute('data-theme', saved);
        updateThemeIcon(saved);
    }
}
function updateThemeIcon(theme) {
    if (theme === 'dark') {
        themeIcon.innerHTML = '<circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>';
    } else {
        themeIcon.innerHTML = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
    }
}
themeToggle.addEventListener('click', () => {
    const current = document.documentElement.getAttribute('data-theme') || 'light';
    const next = current === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('nordic-theme', next);
    updateThemeIcon(next);
    if (waveformData.length > 0) drawWaveform();
    else drawEmptyWaveform();
});

function initVinylGrooves() {
    let svg = '';
    for (let i = 28; i <= 48; i += 2.5) svg += `<circle cx="50" cy="50" r="${i}"/>`;
    vinylGrooves.innerHTML = svg;
}

function initDB() {
    return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, DB_VERSION);
        request.onerror = () => reject(request.error);
        request.onsuccess = () => { db = request.result; resolve(db); };
        request.onupgradeneeded = (event) => {
            const database = event.target.result;
            if (!database.objectStoreNames.contains(STORE_NAME)) {
                database.createObjectStore(STORE_NAME, { keyPath: 'id', autoIncrement: true });
            }
        };
    });
}
async function saveSongToDB(blob, name, type) {
    return new Promise((resolve, reject) => {
        const transaction = db.transaction([STORE_NAME], 'readwrite');
        const store = transaction.objectStore(STORE_NAME);
        const request = store.add({ blob, name, type, addedAt: Date.now() });
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
    });
}
async function getAllSongsFromDB() {
    return new Promise((resolve, reject) => {
        const transaction = db.transaction([STORE_NAME], 'readonly');
        const store = transaction.objectStore(STORE_NAME);
        const request = store.getAll();
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
    });
}
async function deleteSongFromDB(id) {
    return new Promise((resolve, reject) => {
        const transaction = db.transaction([STORE_NAME], 'readwrite');
        const store = transaction.objectStore(STORE_NAME);
        const request = store.delete(id);
        request.onsuccess = () => resolve();
        request.onerror = () => reject(request.error);
    });
}
async function clearAllSongsFromDB() {
    return new Promise((resolve, reject) => {
        const transaction = db.transaction([STORE_NAME], 'readwrite');
        const store = transaction.objectStore(STORE_NAME);
        const request = store.clear();
        request.onsuccess = () => resolve();
        request.onerror = () => reject(request.error);
    });
}

function initAudioContext() {
    if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
    return audioContext;
}
async function analyzeAudio(arrayBuffer) {
    try {
        const ctx = initAudioContext();
        if (ctx.state === 'suspended') await ctx.resume();
        audioBuffer = await ctx.decodeAudioData(arrayBuffer);
        waveformData = extractPeaks(audioBuffer, 200);
        drawWaveform();
        return waveformData;
    } catch (error) {
        console.error('Error analyzing audio:', error);
        return [];
    }
}
function extractPeaks(buffer, numPeaks) {
    const rawData = buffer.getChannelData(0);
    const sampleSize = rawData.length / numPeaks;
    const peaks = [];
    for (let i = 0; i < numPeaks; i++) {
        const start = Math.floor(i * sampleSize);
        const end = Math.floor(start + sampleSize);
        let max = 0;
        for (let j = start; j < end; j++) {
            const abs = Math.abs(rawData[j]);
            if (abs > max) max = abs;
        }
        peaks.push(max);
    }
    const maxPeak = Math.max(...peaks, 0.001);
    return peaks.map(p => p / maxPeak);
}
function getWaveformColors() {
    const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    return {
        progressColor: isDark ? '#8B5CF6' : '#2563EB',
        bgColor: isDark ? '#4b5563' : '#1E293B'
    };
}
function drawWaveform() {
    const canvas = waveformCanvas;
    const ctx = canvas.getContext('2d');
    const dpr = window.devicePixelRatio || 1;
    const rect = canvas.getBoundingClientRect();
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    ctx.scale(dpr, dpr);
    const width = rect.width;
    const height = rect.height;
    const barWidth = width / waveformData.length;
    const progress = audio.duration ? audio.currentTime / audio.duration : 0;
    const progressX = progress * width;
    const colors = getWaveformColors();
    ctx.clearRect(0, 0, width, height);
    waveformData.forEach((peak, i) => {
        const x = i * barWidth;
        const barHeight = Math.max(3, peak * height * 0.85);
        const y = (height - barHeight) / 2;
        ctx.fillStyle = x < progressX ? colors.progressColor : colors.bgColor;
        ctx.globalAlpha = x < progressX ? 1 : 0.35;
        const radius = Math.min(barWidth / 2 - 0.5, 2.5);
        ctx.beginPath();
        ctx.roundRect(x + 0.5, y, barWidth - 1, barHeight, radius);
        ctx.fill();
    });
    ctx.globalAlpha = 1;
    ctx.fillStyle = colors.progressColor;
    ctx.fillRect(progressX - 0.5, 0, 1.5, height);
}

waveformCanvas.addEventListener('click', (e) => {
    if (!audio.duration) return;
    const rect = waveformCanvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const progress = Math.max(0, Math.min(1, x / rect.width));
    audio.currentTime = progress * audio.duration;
});

filePicker.addEventListener('change', async (e) => {
    const files = Array.from(e.target.files).filter(f =>
        f.type.startsWith('audio/') || f.name.match(/\\.(mp3|m4a|wav|flac|ogg|aac|opus)$/i)
    );
    if (files.length === 0) { showToast('No audio files found'); return; }
    showToast(`Adding ${files.length} song${files.length > 1 ? 's' : ''}...`);
    for (let i = 0; i < files.length; i++) {
        const file = files[i];
        try {
            const id = await saveSongToDB(file, cleanName(file.name), file.type);
            const url = URL.createObjectURL(file);
            playlist.push({ id, name: cleanName(file.name), url, type: file.type, size: file.size });
            if (i === files.length - 1) showToast(`${files.length} song${files.length > 1 ? 's' : ''} added`);
        } catch (error) {
            console.error('Error saving song:', error);
            showToast(`Error adding ${file.name}`);
        }
    }
    renderPlaylist();
    if (currentIndex === -1 && playlist.length > 0) loadSong(0);
    filePicker.value = '';
});

function cleanName(filename) {
    return filename.replace(/\\.[^/.]+$/, '').replace(/[_-]/g, ' ').trim();
}
function revokePlaylistURLs() {
    playlist.forEach(song => { if (song.url) URL.revokeObjectURL(song.url); });
}

function renderPlaylist() {
    const existing = playlistSongs.querySelectorAll('.song-item');
    existing.forEach(el => el.remove());
    if (playlist.length === 0) { emptyState.style.display = 'block'; return; }
    emptyState.style.display = 'none';
    playlist.forEach((song, index) => {
        const item = document.createElement('div');
        item.className = `song-item${index === currentIndex ? ' active' : ''}`;
        item.innerHTML = `
            <div class="song-icon">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
            </div>
            <div class="song-item-info">
                <div class="song-item-title">${escapeHtml(song.name)}</div>
                <div class="song-item-duration">Local audio</div>
            </div>
            <button class="song-item-delete" data-index="${index}" aria-label="Delete song">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
            </button>
        `;
        item.addEventListener('click', (e) => {
            if (!e.target.closest('.song-item-delete')) { loadSong(index); closePlaylist(); }
        });
        item.querySelector('.song-item-delete').addEventListener('click', async (e) => {
            e.stopPropagation();
            await deleteSongFromDB(song.id);
            URL.revokeObjectURL(song.url);
            playlist.splice(index, 1);
            if (currentIndex >= index) currentIndex = Math.max(-1, currentIndex - 1);
            if (currentIndex === -1 && playlist.length > 0) loadSong(0);
            else if (playlist.length === 0) resetPlayer();
            renderPlaylist();
            showToast('Song removed');
        });
        playlistSongs.appendChild(item);
    });
}
function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

async function loadSong(index) {
    if (index < 0 || index >= playlist.length) return;
    currentIndex = index;
    const song = playlist[index];
    audio.src = song.url;
    songTitle.textContent = song.name;
    artistName.textContent = 'Local Audio';
    waveformData = [];
    audioBuffer = null;
    drawEmptyWaveform();
    cover.classList.add('playing');
    tonearm.classList.add('playing');
    playBtn.classList.add('playing');
    updatePlayIcon(true);
    try {
        await audioContext?.resume();
        const arrayBuffer = await fetch(song.url).then(r => r.arrayBuffer());
        await analyzeAudio(arrayBuffer);
    } catch (error) { console.error('Error loading audio:', error); }
    audio.play().then(() => { isPlaying = true; updateMediaSession(); }).catch(() => {});
    renderPlaylist();
    updatePlaylistActive();
}

function resetPlayer() {
    audio.src = '';
    songTitle.textContent = 'Choose music';
    artistName.textContent = 'Your local library';
    cover.classList.remove('playing');
    tonearm.classList.remove('playing');
    playBtn.classList.remove('playing');
    isPlaying = false;
    currentIndex = -1;
    waveformData = [];
    audioBuffer = null;
    drawEmptyWaveform();
    updatePlayIcon(false);
    currentTimeEl.textContent = '0:00';
    totalTimeEl.textContent = '0:00';
    progressRing.style.strokeDashoffset = RING_CIRCUMFERENCE;
}

function updatePlayIcon(playing) {
    if (playing) {
        playIcon.innerHTML = '<rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/>';
    } else {
        playIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
    }
}
function updatePlaylistActive() {
    document.querySelectorAll('.song-item').forEach((el, i) => {
        el.classList.toggle('active', i === currentIndex);
    });
}

playBtn.addEventListener('click', togglePlay);
function togglePlay() {
    if (!audio.src) return;
    if (isPlaying) {
        audio.pause();
        isPlaying = false;
        cover.classList.remove('playing');
        tonearm.classList.remove('playing');
        playBtn.classList.remove('playing');
    } else {
        audio.play();
        isPlaying = true;
        cover.classList.add('playing');
        tonearm.classList.add('playing');
        playBtn.classList.add('playing');
    }
    updatePlayIcon(isPlaying);
}

prevBtn.addEventListener('click', () => {
    if (audio.currentTime > 5) audio.currentTime = 0;
    else if (playlist.length > 0) loadSong(currentIndex > 0 ? currentIndex - 1 : playlist.length - 1);
});
nextBtn.addEventListener('click', () => {
    if (playlist.length === 0) return;
    let nextIndex;
    if (shuffle) nextIndex = Math.floor(Math.random() * playlist.length);
    else nextIndex = (currentIndex + 1) % playlist.length;
    loadSong(nextIndex);
});
shuffleBtn.addEventListener('click', () => {
    shuffle = !shuffle;
    shuffleBtn.classList.toggle('active', shuffle);
});
loopBtn.addEventListener('click', () => {
    loop = !loop;
    loopBtn.classList.toggle('active', loop);
});

audio.addEventListener('timeupdate', () => {
    if (!audio.duration) return;
    const progress = audio.currentTime / audio.duration;
    progressFill.style.width = `${progress * 100}%`;
    currentTimeEl.textContent = formatTime(audio.currentTime);
    totalTimeEl.textContent = formatTime(audio.duration);
    const offset = RING_CIRCUMFERENCE - (progress * RING_CIRCUMFERENCE);
    progressRing.style.strokeDashoffset = offset;
    drawWaveform();
});
audio.addEventListener('ended', () => {
    if (loop) { audio.currentTime = 0; audio.play(); }
    else nextBtn.click();
});
audio.addEventListener('error', () => { showToast('Error loading audio'); nextBtn.click(); });

function formatTime(seconds) {
    if (isNaN(seconds)) return '0:00';
    const mins = Math.floor(seconds / 60);
    const secs = Math.floor(seconds % 60);
    return `${mins}:${secs.toString().padStart(2, '0')}`;
}

function openPlaylist() {
    playlistPanel.classList.add('open');
    overlay.classList.add('visible');
}
function closePlaylist() {
    playlistPanel.classList.remove('open');
    overlay.classList.remove('visible');
}
playlistToggle.addEventListener('click', () => {
    if (playlistPanel.classList.contains('open')) closePlaylist();
    else openPlaylist();
});
overlay.addEventListener('click', closePlaylist);
addMoreBtn.addEventListener('click', () => { closePlaylist(); setTimeout(() => filePicker.click(), 300); });
clearAllBtn.addEventListener('click', async () => {
    if (playlist.length === 0) return;
    await clearAllSongsFromDB();
    playlist.forEach(song => URL.revokeObjectURL(song.url));
    playlist = [];
    resetPlayer();
    renderPlaylist();
    closePlaylist();
    showToast('Playlist cleared');
});

let touchStartX = 0;
let touchStartY = 0;
document.addEventListener('touchstart', (e) => {
    touchStartX = e.changedTouches[0].screenX;
    touchStartY = e.changedTouches[0].screenY;
});
document.addEventListener('touchend', (e) => {
    const dx = e.changedTouches[0].screenX - touchStartX;
    const dy = e.changedTouches[0].screenY - touchStartY;
    if (Math.abs(dx) > 80 && Math.abs(dx) > Math.abs(dy)) {
        if (dx < 0) nextBtn.click(); else prevBtn.click();
    } else if (dy < -100) openPlaylist();
});

function updateMediaSession() {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
        title: playlist[currentIndex]?.name || 'Unknown',
        artist: 'Nordic Wave',
        album: 'Local Library'
    });
    navigator.mediaSession.setActionHandler('play', togglePlay);
    navigator.mediaSession.setActionHandler('pause', togglePlay);
    navigator.mediaSession.setActionHandler('previoustrack', () => prevBtn.click());
    navigator.mediaSession.setActionHandler('nexttrack', () => nextBtn.click());
}

function showToast(message) {
    toast.textContent = message;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2500);
}

function drawEmptyWaveform() {
    const canvas = waveformCanvas;
    const ctx = canvas.getContext('2d');
    const dpr = window.devicePixelRatio || 1;
    const rect = canvas.getBoundingClientRect();
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    ctx.scale(dpr, dpr);
    const width = rect.width;
    const height = rect.height;
    const barWidth = 2.5;
    const gap = 2;
    const bars = Math.floor(width / (barWidth + gap));
    const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    ctx.clearRect(0, 0, width, height);
    ctx.fillStyle = isDark ? 'rgba(255,255,255,0.08)' : '#DCD9D1';
    for (let i = 0; i < bars; i++) {
        const x = i * (barWidth + gap);
        const barHeight = 3;
        const y = (height - barHeight) / 2;
        ctx.beginPath();
        ctx.roundRect(x, y, barWidth, barHeight, 1);
        ctx.fill();
    }
}

let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferredPrompt = e; setTimeout(() => installBanner.classList.add('show'), 3000); });
installBtn.addEventListener('click', async () => {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    const { outcome } = await deferredPrompt.userChoice;
    if (outcome === 'accepted') installBanner.classList.remove('show');
    deferredPrompt = null;
});
installClose.addEventListener('click', () => installBanner.classList.remove('show'));

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});

async function init() {
    initTheme();
    try {
        await initDB();
        const songs = await getAllSongsFromDB();
        if (songs.length > 0) {
            for (const song of songs) {
                const url = URL.createObjectURL(song.blob);
                playlist.push({ id: song.id, name: song.name, url, type: song.type });
            }
            renderPlaylist();
        }
    } catch (error) { console.error('Error initializing:', error); }
    initVinylGrooves();
    drawEmptyWaveform();
    progressRing.style.strokeDasharray = `${RING_CIRCUMFERENCE} ${RING_CIRCUMFERENCE}`;
    progressRing.style.strokeDashoffset = RING_CIRCUMFERENCE;
    window.addEventListener('resize', () => {
        if (waveformData.length > 0) drawWaveform();
        else drawEmptyWaveform();
    });
}
init();
</script>
